<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant Multi-stop Gradients -->
    <linearGradient id="crmBubbleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="crmArrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <linearGradient id="crmNodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Subtle Drop Shadow Filter -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#0284C7" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Main Container with Drop Shadow (No ugly solid background block) -->
  <g filter="url(#softShadow)">
    <!-- WhatsApp / Chat Bubble Contour -->
    <path d="M256 70 C154 70 72 152 72 254 C72 288 81 319 98 347 L80 416 L154 398 C183 418 218 430 256 430 C358 430 440 348 440 254 C440 152 358 70 256 70 Z" 
          fill="none" 
          stroke="url(#crmBubbleGrad)" 
          stroke-width="32" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Connected Growth Path -->
    <path d="M165 295 L225 235 L285 275 L345 185" 
          fill="none" 
          stroke="url(#crmArrowGrad)" 
          stroke-width="24" 
          stroke-linecap="round" 
          stroke-linejoin="round" />

    <!-- Ascending Arrow Head -->
    <polygon points="340,150 375,200 320,195" fill="#10B981" stroke="#10B981" stroke-width="4" stroke-linejoin="round" />

    <!-- Network Interconnect Dotted Lines -->
    <line x1="165" y1="295" x2="205" y2="360" stroke="#00D2FF" stroke-width="8" stroke-linecap="round" stroke-dasharray="4 8" stroke-opacity="0.7" />
    <line x1="225" y1="235" x2="275" y2="185" stroke="#0284C7" stroke-width="8" stroke-linecap="round" stroke-dasharray="4 8" stroke-opacity="0.7" />
    <line x1="285" y1="275" x2="315" y2="350" stroke="#10B981" stroke-width="8" stroke-linecap="round" stroke-dasharray="4 8" stroke-opacity="0.7" />

    <!-- Lead / Customer Network Glowing Nodes -->
    <!-- Node 1 -->
    <circle cx="165" cy="295" r="20" fill="url(#crmNodeGrad)" />
    <circle cx="165" cy="295" r="10" fill="#FFFFFF" />

    <!-- Node 2 -->
    <circle cx="225" cy="235" r="20" fill="url(#crmNodeGrad)" />
    <circle cx="225" cy="235" r="10" fill="#FFFFFF" />

    <!-- Node 3 -->
    <circle cx="285" cy="275" r="20" fill="url(#crmNodeGrad)" />
    <circle cx="285" cy="275" r="10" fill="#FFFFFF" />

    <!-- Sub-Nodes -->
    <circle cx="205" cy="360" r="13" fill="#00D2FF" />
    <circle cx="205" cy="360" r="6" fill="#FFFFFF" />

    <circle cx="275" cy="185" r="13" fill="#0284C7" />
    <circle cx="275" cy="185" r="6" fill="#FFFFFF" />

    <circle cx="315" cy="350" r="13" fill="#10B981" />
    <circle cx="315" cy="350" r="6" fill="#FFFFFF" />
  </g>
</svg>
